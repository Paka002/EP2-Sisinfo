{{ define "main" }}
    <section class="page-content" aria-labelledby="list-title">
        <p class="eyebrow">{{ .Section | humanize }}</p>
        <h1 id="list-title">{{ .Title }}</h1>
        {{ .Content }}
        <div class="project-grid">
            {{ range .Pages }}
                <article class="project-card">
                    <p class="card-kicker">{{ .Params.category }}</p>
                    <h2><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
                    <p>{{ .Summary }}</p>
                    <a class="text-link" href="{{ .RelPermalink }}">Ver projeto <span aria-hidden="true">→</span></a>
                </article>
            {{ end }}
        </div>
    </section>
{{ end }}
