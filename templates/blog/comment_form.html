{% extends "base.html" %}
{% block title %}Comentar · Sisinfo{% endblock %}
{% block content %}
<section class="page-content">
    <p class="eyebrow">Participação</p>
    <h1>Adicionar comentário</h1>
    <form method="post" class="form-card">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="button" type="submit">Publicar comentário</button>
    </form>
</section>
{% endblock %}
