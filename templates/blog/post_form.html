{% extends "base.html" %}
{% block title %}{{ action }} post · Sisinfo{% endblock %}
{% block content %}
<section class="page-content">
    <p class="eyebrow">CRUD</p>
    <h1>{{ action }} post</h1>
    <form method="post" class="form-card">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {{ field.errors }}
        {% endfor %}
        <button class="button" type="submit">{{ action }} post</button>
    </form>
</section>
{% endblock %}
