{% extends "base.html" %}
{% block title %}{{ action }} post · Sisinfo{% endblock %}
{% block content %}
<section class="page-content">
    <p class="eyebrow">CRUD</p>
    <h1>{{ action }} post</h1>
    <form method="post" class="form-card">
        {% csrf_token %}
        <label for="title">Título</label>
        <input id="title" name="title" value="{{ post.title|default:'' }}" required maxlength="200">
        <label for="content">Conteúdo HTML</label>
        <textarea id="content" name="content" rows="12" required>{{ post.content|default:'' }}</textarea>
        <label for="published_at">Data de publicação</label>
        <input id="published_at" name="published_at" type="datetime-local" value="{{ post.published_at|date:'Y-m-d\TH:i' }}" required>
        <button class="button" type="submit">{{ action }} post</button>
    </form>
</section>
{% endblock %}
